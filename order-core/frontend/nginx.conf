server {
    listen 80;

    root /usr/share/nginx/html;
    index index.html;

    # Rutas fijas (sin segmentos dinámicos) exportadas por Next.js
    # (output: "export"): cada una resuelve a su .html correspondiente.
    location / {
        try_files $uri $uri.html $uri/ =404;
    }

    error_page 404 /404.html;
    location = /404.html {
        internal;
    }
}
