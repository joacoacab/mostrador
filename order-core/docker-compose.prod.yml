services:
  db:
    # pgvector/pgvector en vez de postgres a secas (tarea 39, RAG Engine):
    # trae la extensión vector precompilada. No hay build -alpine de
    # pgvector, se cambia a la imagen Debian (mismo Postgres 16 abajo).
    image: pgvector/pgvector:pg16
    restart: unless-stopped
    env_file:
      - .env.prod
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      # Hardcodeado a propósito: env_file inyecta variables AL
      # container, pero no alimenta la interpolación ${...} de Compose
      # (eso necesita un .env sin sufijo al lado del compose, o env
      # del shell). Usuario/nombre de base no son datos sensibles.
      test: ["CMD-SHELL", "pg_isready -U mostrador -d mostrador"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - internal

  web:
    build:
      context: ./backend
    restart: unless-stopped
    env_file:
      - .env.prod
    depends_on:
      db:
        condition: service_healthy
    networks:
      - traefik
      - internal

  nginx:
    image: nginx:alpine
    restart: unless-stopped
    volumes:
      - ./frontend/nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - /home/ubuntu/mostrador-frontend:/usr/share/nginx/html:ro
    depends_on:
      - web
    networks:
      - traefik

networks:
  traefik:
    external: true
  internal:
    driver: bridge

volumes:
  postgres_data:
