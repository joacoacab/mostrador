services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    env_file:
      - .env.prod
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - internal

  web:
    build:
      context: ./backend
    restart: unless-stopped
    env_file:
      - .env.prod
    depends_on:
      db:
        condition: service_healthy
    networks:
      - traefik
      - internal

  nginx:
    image: nginx:alpine
    restart: unless-stopped
    volumes:
      - ./frontend/nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - /home/ubuntu/mostrador-frontend:/usr/share/nginx/html:ro
    depends_on:
      - web
    networks:
      - traefik

networks:
  traefik:
    external: true
  internal:
    driver: bridge

volumes:
  postgres_data:
