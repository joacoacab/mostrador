name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: order-core/backend
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: mostrador
          POSTGRES_USER: mostrador
          POSTGRES_PASSWORD: mostrador
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U mostrador"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 5
    env:
      POSTGRES_DB: mostrador
      POSTGRES_USER: mostrador
      POSTGRES_PASSWORD: mostrador
      POSTGRES_HOST: localhost
      POSTGRES_PORT: 5432
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        if: hashFiles('order-core/backend/requirements.txt') != ''
        run: pip install -r requirements.txt
      - name: Lint (ruff)
        if: hashFiles('order-core/backend/requirements.txt') != ''
        run: ruff check .
      - name: Tests
        if: hashFiles('order-core/backend/manage.py') != ''
        run: python manage.py test

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: order-core/frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Install dependencies
        if: hashFiles('order-core/frontend/package.json') != ''
        run: npm ci
      - name: Lint
        if: hashFiles('order-core/frontend/package.json') != ''
        run: npm run lint
      - name: Tests
        if: hashFiles('order-core/frontend/package.json') != ''
        run: npm test
